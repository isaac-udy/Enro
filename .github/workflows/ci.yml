name: CI
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Superseded PR runs are wasted compute: when a new push lands on a PR, cancel
# the in-flight run for the previous commit. Pushes to main are never
# cancelled — every main commit keeps its complete CI record for bisecting.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-linux:
    name: CI / Linux (Android, Desktop, wasmJs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            isCodeChange:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.toml'

      - name: Set up JDK 21
        if: steps.changes.outputs.isCodeChange == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup gradle
        if: steps.changes.outputs.isCodeChange == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run continuous integration
        if: steps.changes.outputs.isCodeChange == 'true'
        env:
          EW_API_TOKEN: ${{ secrets.EW_API_TOKEN }}
        run: ./gradlew continuousIntegration --continue

  ci-macos:
    name: CI / macOS (iOS)
    # macos-26 ships Xcode 26 / iOS 26 SDK, required by Compose Multiplatform 1.11+
    # (skiko references the iOS 26 UIViewLayoutRegion API; older SDKs fail to link).
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            isCodeChange:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.toml'

      - name: Set up JDK 21
        if: steps.changes.outputs.isCodeChange == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup gradle
        if: steps.changes.outputs.isCodeChange == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run continuous integration (macOS)
        if: steps.changes.outputs.isCodeChange == 'true'
        run: ./gradlew continuousIntegrationMacOs --continue
